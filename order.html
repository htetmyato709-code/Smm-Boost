<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order History - SMM Boost</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between glass p-4 rounded-2xl">
      <a href="user-dashboard.html" class="text-indigo-400 hover:text-indigo-300 text-sm flex items-center gap-1">
        ← Back to Dashboard
      </a>
      <h1 class="text-base font-semibold">Order History (အော်ဒါမှတ်တမ်းများ)</h1>
    </div>

    <!-- Orders Table -->
    <div class="glass p-5 md:p-7 rounded-3xl space-y-4">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs md:text-sm">
          <thead class="text-slate-400 border-b border-slate-800">
            <tr>
              <th class="py-3 px-2">Service</th>
              <th class="py-3 px-2">Link</th>
              <th class="py-3 px-2">Qty</th>
              <th class="py-3 px-2">Cost</th>
              <th class="py-3 px-2">Provider ID</th>
              <th class="py-3 px-2 text-right">Status</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody" class="divide-y divide-slate-800/60">
            <tr>
              <td colspan="6" class="text-center py-6 text-slate-500">အော်ဒါမှတ်တမ်းများ ရယူနေပါသည်...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/config.js';

    async function loadUserOrders() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      const tbody = document.getElementById('ordersTableBody');

      const { data: orders, error } = await supabase
        .from('orders')
        .select('*')
        .eq('user_id', user.id)
        .order('created_at', { ascending: false });

      if (error || !orders.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-6 text-slate-500">တင်ထားသော အော်ဒါမှတ်တမ်း မရှိသေးပါ။</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      orders.forEach(order => {
        let statusBadge = '';
        if (order.status === 'completed') {
          statusBadge = '<span class="px-2.5 py-1 rounded-full text-[11px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Completed</span>';
        } else if (order.status === 'processing') {
          statusBadge = '<span class="px-2.5 py-1 rounded-full text-[11px] bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">Processing</span>';
        } else if (order.status === 'cancelled') {
          statusBadge = '<span class="px-2.5 py-1 rounded-full text-[11px] bg-rose-500/20 text-rose-400 border border-rose-500/30">Cancelled</span>';
        } else {
          statusBadge = '<span class="px-2.5 py-1 rounded-full text-[11px] bg-amber-500/20 text-amber-400 border border-amber-500/30">Pending</span>';
        }

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-900/40";
        tr.innerHTML = `
          <td class="py-3 px-2 font-medium text-slate-200">
            <span class="text-indigo-400 font-mono text-[11px]">[ID: ${order.service_id || '-'}]</span>
            <div>${order.service_name || '-'}</div>
          </td>
          <td class="py-3 px-2">
            <a href="${order.target_link}" target="_blank" class="text-blue-400 hover:underline max-w-[120px] inline-block truncate">${order.target_link}</a>
          </td>
          <td class="py-3 px-2 font-medium">${order.quantity?.toLocaleString() || 0}</td>
          <td class="py-3 px-2 text-emerald-400 font-semibold">${order.charge?.toLocaleString() || 0} MMK</td>
          <td class="py-3 px-2 text-slate-400 font-mono text-xs">${order.provider_order_id || 'Waiting'}</td>
          <td class="py-3 px-2 text-right">${statusBadge}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadUserOrders();
  </script>
</body>
</html>
