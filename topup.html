<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topup - SMM Boost</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-2xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between glass p-4 rounded-2xl">
      <a href="user-dashboard.html" class="text-indigo-400 hover:text-indigo-300 text-sm flex items-center gap-1">
        ← Back to Dashboard
      </a>
      <span class="text-sm font-semibold">ငွေဖြည့်သွင်းခြင်း (Add Funds)</span>
    </div>

    <!-- Payment Accounts Details (Auto Sync from Admin Settings) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="glass p-5 rounded-2xl border-l-4 border-l-blue-500 space-y-1">
        <span class="text-xs text-blue-400 font-semibold uppercase tracking-wider">KPay Account</span>
        <p class="text-lg font-bold" id="displayKpayNo">Loading...</p>
        <p class="text-xs text-slate-400" id="displayKpayName">Name: Loading...</p>
      </div>

      <div class="glass p-5 rounded-2xl border-l-4 border-l-yellow-500 space-y-1">
        <span class="text-xs text-yellow-400 font-semibold uppercase tracking-wider">WavePay Account</span>
        <p class="text-lg font-bold" id="displayWaveNo">Loading...</p>
        <p class="text-xs text-slate-400" id="displayWaveName">Name: Loading...</p>
      </div>
    </div>

    <!-- Deposit Submission Form -->
    <div class="glass p-6 md:p-8 rounded-3xl space-y-5">
      <h2 class="text-base font-semibold text-slate-200">ငွေလွှဲပြေစာ ပေးပို့ရန်</h2>

      <form id="topupForm" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1.5">ငွေလွှဲခဲ့သည့် နည်းလမ်း (Payment Method)</label>
          <select id="paymentMethod" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
            <option value="KPay">KPay</option>
            <option value="WavePay">WavePay</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1.5">ငွေပမာဏ (MMK)</label>
          <input type="number" id="depositAmount" required placeholder="ဥပမာ - 5000" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1.5">ငွေလွှဲ Transaction ID (နောက်ဆုံးဂဏန်းများ)</label>
          <input type="text" id="transactionId" required placeholder="Transaction ID ထည့်ပါ" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1.5">ပြေစာ Screenshot Image Link (Imgur / Cloud Link)</label>
          <input type="url" id="screenshotUrl" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <button type="submit" id="submitTopupBtn" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-medium text-sm transition">
          ငွေသွင်းတောင်းဆိုချက် ပေးပို့မည် (Submit Deposit)
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/config.js';

    // Settings မှ Payment အချက်အလက်များ ဆွဲထုတ်ပြသခြင်း
    async function loadPaymentDetails() {
      const { data } = await supabase
        .from('system_settings')
        .select('*')
        .eq('id', 'main_settings')
        .single();

      if (data) {
        document.getElementById('displayKpayNo').innerText = data.kpay_number || 'မရှိသေးပါ';
        document.getElementById('displayKpayName').innerText = `Name: ${data.kpay_name || '-'}`;
        document.getElementById('displayWaveNo').innerText = data.wave_number || 'မရှိသေးပါ';
        document.getElementById('displayWaveName').innerText = `Name: ${data.wave_name || '-'}`;
      }
    }

    loadPaymentDetails();

    // Topup Form ပို့ခြင်း
    document.getElementById('topupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitTopupBtn');
      btn.disabled = true;
      btn.innerText = "Submitting...";

      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        alert("ငွေသွင်းရန် အရင် Login ဝင်ပေးပါ။");
        window.location.href = "login.html";
        return;
      }

      const depositData = {
        user_id: user.id,
        user_email: user.email,
        payment_method: document.getElementById('paymentMethod').value,
        amount: parseFloat(document.getElementById('depositAmount').value),
        transaction_id: document.getElementById('transactionId').value,
        screenshot_url: document.getElementById('screenshotUrl').value,
        status: 'pending'
      };

      const { error } = await supabase.from('deposits').insert([depositData]);

      if (error) {
        alert("အမှားအယွင်းရှိပါသည်: " + error.message);
        btn.disabled = false;
        btn.innerText = "ငွေသွင်းတောင်းဆိုချက် ပေးပို့မည်";
      } else {
        alert("ငွေသွင်းတောင်းဆိုချက် ပို့ပြီးပါပြီ။ Admin ဘက်မှ အတည်ပြုပေးပါမည်။");
        window.location.href = "user-dashboard.html";
      }
    });
  </script>
</body>
</html>
