<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - SMM Boost</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-16">

  <!-- Header -->
  <header class="glass sticky top-0 z-40 px-4 py-3 flex justify-between items-center border-b border-slate-800">
    <div class="flex items-center gap-3">
      <a href="user-dashboard.html" class="text-slate-400 hover:text-white text-lg">←</a>
      <h1 class="text-base font-bold text-indigo-400">အကောင့်အချက်အလက် (Profile)</h1>
    </div>
    <span class="text-xs text-slate-400" id="profileRole">User</span>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-5 mt-2">

    <!-- Profile Details Card -->
    <div class="glass p-6 rounded-3xl space-y-4">
      <div class="text-center pb-2 border-b border-slate-800">
        <div class="w-16 h-16 mx-auto bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 rounded-full flex items-center justify-center text-2xl font-bold mb-2">
          👤
        </div>
        <h2 class="text-base font-bold text-white" id="p_username">Username</h2>
        <p class="text-xs text-slate-400" id="p_email">user@email.com</p>
      </div>

      <!-- Update Phone Form -->
      <form id="phoneForm" class="space-y-3 pt-2">
        <div>
          <label class="block text-xs text-slate-400 mb-1.5">ဖုန်းနံပါတ် (Phone Number)</label>
          <input type="tel" id="p_phone" placeholder="09xxxxxxxxx" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" id="savePhoneBtn" class="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs transition border border-slate-700">
          ဖုန်းနံပါတ် သိမ်းဆည်းမည်
        </button>
      </form>
    </div>

    <!-- Change Password Card -->
    <div class="glass p-6 rounded-3xl space-y-4">
      <h3 class="text-sm font-bold text-indigo-300">Password အသစ်ပြောင်းလဲရန်</h3>
      
      <form id="passwordForm" class="space-y-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1.5">New Password (အသစ်)</label>
          <input type="password" id="newPassword" minlength="6" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1.5">Confirm New Password</label>
          <input type="password" id="confirmNewPassword" minlength="6" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <button type="submit" id="changePasswordBtn" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs transition shadow-lg shadow-indigo-600/20">
          Password အသစ် ပြောင်းလဲမည်
        </button>
      </form>
    </div>

  </main>

  <script type="module">
    import { supabase } from './js/config.js';

    let currentUser = null;

    async function initProfile() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUser = user;

      const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
      if (profile) {
        document.getElementById('p_username').innerText = profile.username || 'User';
        document.getElementById('p_email').innerText = profile.email;
        document.getElementById('p_phone').value = profile.phone || '';
        document.getElementById('profileRole').innerText = profile.role === 'admin' ? 'Admin' : 'Member';
      }
    }

    // Phone Save
    document.getElementById('phoneForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('p_phone').value;
      const btn = document.getElementById('savePhoneBtn');
      btn.disabled = true;
      btn.innerText = "Saving...";

      const { error } = await supabase.from('profiles').update({ phone }).eq('id', currentUser.id);
      if (error) alert("အမှားရှိပါသည်: " + error.message);
      else alert("ဖုန်းနံပါတ် အောင်မြင်စွာ သိမ်းဆည်းပြီးပါပြီ။");

      btn.disabled = false;
      btn.innerText = "ဖုန်းနံပါတ် သိမ်းဆည်းမည်";
    });

    // Password Change
    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('confirmNewPassword').value;

      if (p1 !== p2) return alert("Password အသစ် (၂) ကြိမ် ရိုက်ထည့်မှု မတူညီပါ။");

      const btn = document.getElementById('changePasswordBtn');
      btn.disabled = true;
      btn.innerText = "Changing...";

      const { error } = await supabase.auth.updateUser({ password: p1 });
      if (error) {
        alert("Password ပြောင်းလဲ၍ မရပါ: " + error.message);
      } else {
        alert("Password အသစ် အောင်မြင်စွာ ပြောင်းလဲပြီးပါပြီ။");
        document.getElementById('passwordForm').reset();
      }

      btn.disabled = false;
      btn.innerText = "Password အသစ် ပြောင်းလဲမည်";
    });

    initProfile();
  </script>
</body>
  </html>
