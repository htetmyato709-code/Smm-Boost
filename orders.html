<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order History - SMM Boost</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-16">

  <!-- Header -->
  <header class="glass sticky top-0 z-40 px-4 py-3.5 flex justify-between items-center border-b border-slate-800">
    <div class="flex items-center gap-3">
      <a href="user-dashboard.html" class="w-9 h-9 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 hover:text-white transition">
        ←
      </a>
      <div>
        <h1 class="text-base font-bold text-white leading-tight">Order History</h1>
        <p class="text-[10px] text-slate-400">တင်ထားသော အော်ဒါမှတ်တမ်းများ</p>
      </div>
    </div>
    <div class="glass px-3 py-1.5 rounded-xl border border-indigo-500/30">
      <span class="text-xs font-bold text-indigo-400" id="totalOrdersCount">0 Orders</span>
    </div>
  </header>

  <!-- Filter & Search Section -->
  <main class="max-w-xl mx-auto p-4 space-y-3.5">
    
    <!-- Status Filter Pills -->
    <div class="flex items-center gap-2 overflow-x-auto pb-1 hide-scrollbar" id="statusFilterBar">
      <button onclick="filterStatus('all')" id="btn-all" class="filter-btn px-3.5 py-1.5 rounded-xl bg-blue-600 text-white text-xs font-semibold whitespace-nowrap shadow-md shadow-blue-600/30">အားလုံး</button>
      <button onclick="filterStatus('pending')" id="btn-pending" class="filter-btn px-3.5 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-amber-400 text-xs font-semibold whitespace-nowrap">Pending</button>
      <button onclick="filterStatus('processing')" id="btn-processing" class="filter-btn px-3.5 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-blue-400 text-xs font-semibold whitespace-nowrap">Processing</button>
      <button onclick="filterStatus('completed')" id="btn-completed" class="filter-btn px-3.5 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-emerald-400 text-xs font-semibold whitespace-nowrap">Completed</button>
      <button onclick="filterStatus('cancelled')" id="btn-cancelled" class="filter-btn px-3.5 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-rose-400 text-xs font-semibold whitespace-nowrap">Cancelled</button>
    </div>

    <!-- Search Input -->
    <div class="relative">
      <input type="text" id="searchInput" placeholder="Order ID သို့မဟုတ် Link ဖြင့် ရှာရန်..." class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl pl-10 pr-4 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
      <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs">🔍</span>
    </div>

    <!-- Order Cards List Container -->
    <div id="ordersListContainer" class="space-y-3 pt-1">
      <div class="glass p-5 rounded-2xl border border-slate-800 text-center py-10 space-y-2">
        <p class="text-xs text-slate-400 animate-pulse">အော်ဒါများကို ရယူနေပါသည်... ⏳</p>
      </div>
    </div>

  </main>
    <!-- Embedded JavaScript System -->
  <script type="module">
    import { supabase } from './js/config.js';

    let allOrders = [];
    let currentFilter = 'all';

    async function initOrderHistory() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      // Fetch Orders for current user
      const { data, error } = await supabase
        .from('orders')
        .select('*')
        .eq('user_id', user.id)
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('ordersListContainer').innerHTML = `
          <div class="glass p-6 rounded-2xl text-center text-xs text-rose-400 border border-rose-500/20">
            အော်ဒါများ ခေါ်ယူရာတွင် အမှားဖြစ်ပေါ်ခဲ့သည်: ${error.message}
          </div>
        `;
        return;
      }

      allOrders = data || [];
      document.getElementById('totalOrdersCount').innerText = `${allOrders.length} Orders`;
      renderOrders();
    }

    // Status Colors & Badge Helper
    function getStatusBadge(status) {
      const s = (status || 'pending').toLowerCase();
      let colorClass = "bg-amber-500/10 text-amber-400 border-amber-500/30";
      let dotColor = "bg-amber-400";

      if (s === 'processing' || s === 'in progress') {
        colorClass = "bg-blue-500/10 text-blue-400 border-blue-500/30";
        dotColor = "bg-blue-400";
      } else if (s === 'completed') {
        colorClass = "bg-emerald-500/10 text-emerald-400 border-emerald-500/30";
        dotColor = "bg-emerald-400";
      } else if (s === 'cancelled' || s === 'canceled') {
        colorClass = "bg-rose-500/10 text-rose-400 border-rose-500/30";
        dotColor = "bg-rose-400";
      }

      return `
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold border uppercase tracking-wider ${colorClass}">
          <span class="w-1.5 h-1.5 rounded-full ${dotColor}"></span>
          ${s}
        </span>
      `;
    }

    // Render Cards to Mobile Screen
    function renderOrders() {
      const container = document.getElementById('ordersListContainer');
      const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();

      let filtered = allOrders;

      // Filter by Status
      if (currentFilter !== 'all') {
        filtered = filtered.filter(o => (o.status || '').toLowerCase() === currentFilter);
      }

      // Filter by Search (ID or Link)
      if (searchKeyword) {
        filtered = filtered.filter(o => {
          const numId = (o.numeric_id || '').toString();
          const uuid = (o.id || '').toLowerCase();
          const link = (o.target_link || '').toLowerCase();
          return numId.includes(searchKeyword) || uuid.includes(searchKeyword) || link.includes(searchKeyword);
        });
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="glass p-8 rounded-3xl text-center space-y-2 border border-slate-800">
            <span class="text-3xl">📦</span>
            <p class="text-xs text-slate-400">အော်ဒါမှတ်တမ်း မရှိသေးပါ</p>
          </div>
        `;
        return;
      }

      container.innerHTML = '';

      filtered.forEach(order => {
        const orderNumId = order.numeric_id ? `#${order.numeric_id}` : `#${order.id.slice(0, 5)}`;
        const dateStr = order.created_at ? new Date(order.created_at).toLocaleString('my-MM', {
          year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        }) : '-';

        const card = document.createElement('div');
        card.className = "glass p-4 md:p-5 rounded-3xl border border-slate-800/90 space-y-3.5 hover:border-slate-700 transition";

        card.innerHTML = `
          <!-- Top Row: Order ID & Status Badge -->
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="px-3 py-1 rounded-xl bg-indigo-600/20 border border-indigo-500/40 text-indigo-300 text-sm font-black tracking-wider">
                ${orderNumId}
              </span>
              <span class="text-[10px] text-slate-500 font-mono">${dateStr}</span>
            </div>
            ${getStatusBadge(order.status)}
          </div>

          <!-- Service Name -->
          <div>
            <p class="text-xs font-bold text-white leading-snug">${order.service_name || 'Service'}</p>
          </div>

          <!-- Target Link -->
          <div class="bg-slate-900/80 px-3 py-2 rounded-xl border border-slate-800/70 flex items-center justify-between gap-2">
            <span class="text-slate-500 text-xs">🔗</span>
            <a href="${order.target_link}" target="_blank" class="text-[11px] text-blue-400 truncate hover:underline flex-1">
              ${order.target_link}
            </a>
          </div>

          <!-- Bottom Grid: Quantity & Charge -->
          <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-800/60 text-xs">
            <div class="flex flex-col">
              <span class="text-[10px] text-slate-500 uppercase">Quantity</span>
              <span class="font-bold text-slate-200 mt-0.5">${Number(order.quantity || 0).toLocaleString()}</span>
            </div>
            <div class="flex flex-col text-right">
              <span class="text-[10px] text-slate-500 uppercase">ကျသင့်ငွေ</span>
              <span class="font-black text-rose-400 mt-0.5">${Number(order.charge || 0).toLocaleString()} MMK</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Filter Trigger
    window.filterStatus = function(status) {
      currentFilter = status;
      
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => {
        btn.className = "filter-btn px-3.5 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 text-xs font-semibold whitespace-nowrap";
      });

      const activeBtn = document.getElementById(`btn-${status}`);
      if (activeBtn) {
        activeBtn.className = "filter-btn px-3.5 py-1.5 rounded-xl bg-blue-600 text-white text-xs font-semibold whitespace-nowrap shadow-md shadow-blue-600/30";
      }

      renderOrders();
    };

    // Search Trigger
    document.getElementById('searchInput')?.addEventListener('input', () => {
      renderOrders();
    });

    initOrderHistory();
  </script>
</body>
</html>
